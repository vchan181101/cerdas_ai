    sdk: flutter

  # Tambahkan library di sini (perhatikan spasi/indentasi)
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
